version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: psi
      POSTGRES_PASSWORD: psi_secret
      POSTGRES_DB: paysentineliq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psi -d paysentineliq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama — Local LLM (CPU-only, Windows compatible) ──
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b-q4_k_m}
    deploy:
      resources:
        limits:
          memory: 8G
    restart: unless-stopped
    # Pull model on startup
    command: >
      sh -c "ollama serve & sleep 10 && ollama pull $${OLLAMA_MODEL} && wait"

  ocr:
    build:
      context: ../../ocr-service
      dockerfile: Dockerfile
    mem_limit: 4g
    ports:
      - "8010:8010"
    environment:
      - OCR_SERVICE_MAX_MB=${OCR_SERVICE_MAX_MB:-25}
      - OCR_SERVICE_MAX_PAGES=${OCR_SERVICE_MAX_PAGES:-10}
      - OCR_SERVICE_DPI=${OCR_SERVICE_DPI:-300}
      - OCR_SERVICE_API_KEY=${OCR_SERVICE_API_KEY:-}
      - OCR_SERVICE_FORCE_FALLBACK=${OCR_SERVICE_FORCE_FALLBACK:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ── API (local dev) ──
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env.local
    environment:
      - DATABASE_URL=postgresql+asyncpg://psi:psi_secret@postgres:5432/paysentineliq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_PROFILE=${LLM_PROFILE:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5-4b@q4_k_m}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-none}
      - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-1}
      - OCR_PROVIDER=auto
      - OCR_SERVICE_URL=http://ocr:8010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      ocr:
        condition: service_started
    volumes:
      - ..:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data: